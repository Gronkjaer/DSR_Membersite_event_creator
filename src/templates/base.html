<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrangement opretter</title>
    <!-- Bootstrap 5 CSS for responsive layout and components. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
    <!-- Custom CSS for app-specific styles. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Flatpickr CSS for date picker widget. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="container mt-4 mb-5">

        <!-- Tab navigation using Bootstrap nav-tabs. -->
        <ul class="nav nav-tabs" id="appTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <!-- The first tab is active by default. -->
                <button class="nav-link active" id="main-tab" data-bs-toggle="tab"
                        data-bs-target="#main" type="button" role="tab"
                        aria-controls="main" aria-selected="true">
                    Opretter
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="info-tab" data-bs-toggle="tab"
                        data-bs-target="#info" type="button" role="tab"
                        aria-controls="info" aria-selected="false">
                    Info
                </button>
            </li>
        </ul>

        <!-- Tab content panels. -->
        <div class="tab-content pt-4" id="appTabContent">

            <!-- Main tab -->
            <div class="tab-pane fade show active" id="main" role="tabpanel" aria-labelledby="main-tab">
                {% include 'main_tab.html' %}
            </div>

            <!-- Info tab -->
            <div class="tab-pane fade" id="info" role="tabpanel" aria-labelledby="info-tab">
                {% include 'info_tab.html' %}
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS bundle (includes Popper for dropdowns and tooltips). -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    <!-- Flatpickr JS for date picker widget. -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- Flatpickr Danish locale. -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/da.js"></script>
    <!-- Custom JavaScript for form logic. -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
